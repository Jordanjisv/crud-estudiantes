spring.application.name=crud-estudiantes

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/crud_estudiantes
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto del backend
server.port=8080